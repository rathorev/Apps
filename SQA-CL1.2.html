<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Smart Quiz Studio</title>
<style>
:root{--bg:#eef6fb;--bg2:#e9f7f1;--card:#fff;--ink:#1f3347;--mut:#6a7f93;--line:#dbe6ef;--pri:#4a90e2;--ok:#2fa97c;--bad:#e0605a;--warn:#e4a23a;--soft:#f3f8fc}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg),var(--bg2)) fixed;min-height:100vh}
button,input,select{font:inherit}.wrap{max-width:1280px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:22px;background:linear-gradient(90deg,var(--pri),#38b6a3);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mut);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 6px 22px rgba(74,144,226,.08);margin-bottom:12px}.card h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.grid>*{min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px;font-size:12px;color:var(--mut)}.chip b{display:block;font-size:18px;color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:13px;display:inline-block}.btn:hover{border-color:var(--pri)}
.btn.p{background:linear-gradient(135deg,var(--pri),#3bb6b0);color:#fff;border:0}.btn.d{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.sw{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}input[type=checkbox]{accent-color:var(--pri);width:16px;height:16px}
.tw{max-height:58vh;overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%}
th{position:sticky;top:0;background:var(--soft);text-align:left;padding:8px;font-size:12px;color:var(--mut);z-index:1}td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.qc{cursor:pointer;min-width:220px}.rev{display:none;margin-top:6px;padding:8px;background:var(--soft);border-left:3px solid var(--pri);border-radius:8px;font-size:12.5px}.qc:hover .rev,.qc.open .rev{display:block}
.pill{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}.ns{background:#e8eef4;color:#5d7186}.lp{background:#fdf1d8;color:#9a6a0c}.ms{background:#d9f3e8;color:#17794f}
.tag{background:#e3f0fd;color:#2b6cb0;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(30,50,70,.42);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:12px;z-index:50}
.md{background:var(--card);border-radius:18px;max-width:440px;width:100%;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
.qm{max-width:780px;height:min(92vh,820px);display:flex;flex-direction:column;padding:0;overflow:hidden}.qh{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.qb{flex:1;overflow:auto;padding:14px 16px}.qf{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--soft)}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),#3bb6b0);transition:width .3s}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}.opt:hover{border-color:var(--pri)}.opt.on{border-color:var(--pri);background:#eaf3fd}.opt.ok{border-color:var(--ok);background:#e5f6ee}.opt.bad{border-color:var(--bad);background:#fdecea}
.fb{max-height:190px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;font-size:13px;background:var(--soft)}.fb h4{margin:8px 0 2px;font-size:11px;color:var(--mut);text-transform:uppercase}.fb h4:first-child{margin-top:0}
.hint{margin-top:8px;padding:8px 10px;background:#fff7e0;border-radius:10px;color:#7a5b00}.alert{color:#fff;background:var(--bad);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700}
#toasts{position:fixed;top:12px;right:12px;z-index:99;display:flex;flex-direction:column;gap:8px}.toast{background:var(--card);border-left:5px solid var(--pri);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:320px}.toast.ok{border-color:var(--ok)}.toast.bad{border-color:var(--bad)}.toast.warn{border-color:var(--warn)}
html{-webkit-text-size-adjust:100%}
.qm{width:100%;max-width:780px;height:min(94vh,820px);height:min(94dvh,820px);max-height:100%}
.side{display:grid;gap:0 12px;align-content:start}.vtag{font-size:11px;font-weight:700;color:var(--mut);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:1px 8px}.tp{background:#e6f6ef;color:#17794f}
@media(min-width:640px) and (max-width:999px){.side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
@media(min-width:768px){body{font-size:15.5px}.btn{padding:10px 14px;font-size:14px}.sub{font-size:13.5px}.qm{max-width:1000px;height:min(96dvh,1000px)}.qb{padding:20px 26px}.opt{padding:13px 16px}.qh{padding:14px 26px}.qf{padding:12px 20px}}
@media(min-width:1000px){.grid{grid-template-columns:360px minmax(0,1fr)}}
@media(max-width:600px){.qm{height:100dvh}.qf .btn{flex:1 1 45%}.wrap{padding:10px}}
@media(pointer:coarse){.btn,input[type=text],input[type=number],select{min-height:42px}input[type=checkbox]{width:22px;height:22px}}
.fi{border:0;background:none;cursor:pointer;opacity:.3;font-size:15px;padding:2px 3px}.fi.on{opacity:1}.fi:hover{opacity:.7}
@media(pointer:coarse){.fi{font-size:20px;padding:6px}}
.nl{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:4px 10px;margin-top:8px;transition:max-height .2s}.nl.x{max-height:62vh}
.ni{border-top:1px solid var(--line);padding:8px 0;font-size:13px;overflow-wrap:anywhere}.ni:first-child{border-top:0}.ni .m{color:var(--mut);font-size:11px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.nt,.qa{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}.nt{min-height:72px}.qa{min-height:64px;max-height:60vh;height:84px}.qa.ex{height:260px}
.cr td{background:var(--soft);padding:8px 12px}.fi.has{opacity:1}
.acc{padding:0}.acc>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;user-select:none}.acc>summary::-webkit-details-marker{display:none}.acc>summary::after{content:'▾';color:var(--mut)}.acc[open]>summary::after{content:'▴'}.acc>.ab{padding:0 14px 14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .sub{margin-bottom:2px}
.dz{display:block;text-align:center;border:2px dashed #b9d3ea;border-radius:14px;padding:14px 10px;background:var(--soft);cursor:pointer;margin-bottom:8px;transition:.15s}.dz:hover,body.dragging .dz{border-color:var(--pri);background:#e6f1fc;transform:scale(1.01)}
body.dragging::after{content:'📥 Drop your CSV or progress file anywhere';position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(74,144,226,.18);font-size:22px;font-weight:700;color:#1d4f87;z-index:200;pointer-events:none;border:4px dashed var(--pri)}
.side{align-self:start}
@media(min-width:1000px){.side{position:sticky;top:8px;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:auto;padding-right:4px}}
</style></head><body><div id="app"></div><div id="q"></div><div id="auth"></div><div id="toasts"></div>
<script>
const $=s=>document.querySelector(s),K='sqs_v1';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const disp=s=>esc(s).replace(/\\n/g,'<br>');
const norm=s=>String(s??'').replace(/\\[nrt]/g,' ').replace(/\\(.)/g,'$1').replace(/[\r\n\t]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/[.!?]+$/,'');
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const shuf=a=>{for(let i=a.length;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function cq(r){const t=String(r.type||'').trim().toUpperCase();if(!['MC','MS','TF','FB'].includes(t))throw'invalid type "'+r.type+'"';
 if(!String(r.q||'').trim())throw'empty question';if(!String(r.a||'').trim())throw'empty answer';
 const q={id:String(r.id).trim(),type:t,q:r.q,a:String(r.a).trim(),e:r.e||'',h:r.h||'',tip:r.tip||'',topic:String(r.topic||'').trim(),o:[],ai:[],fa:[]};
 if(t=='FB'){q.fa=q.a.split('|').map(norm).filter(Boolean);return q}
 if(t=='TF'){if(!/^(t|f)/i.test(q.a))throw'TF answer must be True or False';q.o=['True','False'];q.ai=[/^t/i.test(q.a)?0:1];return q}
 const map=[];(r.o||[]).forEach((x,i)=>{x=String(x||'').trim();if(x){map[i]=q.o.length;q.o.push(x)}});
 if(q.o.length<2)throw'needs at least 2 options';
 q.a.split(/[|;,]/).map(x=>x.trim()).filter(Boolean).forEach(k=>{const i=/^[a-f]$/i.test(k)?map[k.toUpperCase().charCodeAt(0)-65]:q.o.findIndex(x=>norm(x)==norm(k));if(i==null||i<0)throw'answer "'+k+'" not found in options';if(!q.ai.includes(i))q.ai.push(i)});
 if(t=='MC'&&q.ai.length!=1)throw'MC needs exactly one answer';return q}
const DEF=()=>[
['MC','Which file format does Smart Quiz Studio use to import questions?',['CSV','PDF','DOCX','XML'],'A','Question banks are imported from, and exported to, CSV files.','Think spreadsheet.'],
['MC','Which type code means Multiple Select?',['MC','MS','TF','FB'],'B','MS = Multiple Select (several correct answers). MC is single-answer.','S for Select.'],
['TF','Exam Mode shows the correct answer immediately after every submission.',[],'False','Exam Mode hides answers and explanations until the final review.','Practice gives instant feedback.','Do not confuse the two modes.'],
['MC','With Enforce Learning ON, what happens to an incorrectly answered question?',['It is deleted','It is re-queued at the end of the session','Nothing','It is auto-marked Mastered'],'B','Missed questions are appended to the back of the queue with cleared choices and a red “Needs review” flag.','Think repetition.'],
['FB','A question becomes ____ only after a correct attempt.',[],'Mastered','Mastery requires a correct attempt; a later miss moves it back to Learning.','Status pill, green.'],
['MS','Which are Practice Mode features?',['Hint reveal','Instant feedback','Redo a question','Answers hidden until the end'],'A|B|C','Practice offers hints, immediate feedback and Redo. Hidden answers belong to Exam Mode.','Three are correct.'],
['TF','Progress is automatically saved to browser LocalStorage.',[],'True','State is saved after submissions, navigation and settings changes, and restored on reload.','',''],
['MC','How many questions does the Question Overview table show per page?',['5','10','20','50'],'B','Ten rows per page, in a vertically scrollable container.','',''],
['FB','Mastery percentage = Correct ÷ Total ____.',[],'Attempts','Mastery % compares correct answers to all attempts on that question.','Not “questions”.'],
['MC','Which button flags a question for review and moves on?',['Skip','Mark & Next','Redo','Check Answer'],'B','Mark & Next flags the question and auto-advances.','Has an ampersand.'],
['TF','Pause is always allowed in Exam Mode.',[],'False','In Exam Mode, Pause is only allowed when more than 30 questions are selected.','Think formal exam rules.'],
['MC','What does turning OFF “Replace existing bank” do on import?',['Deletes the bank','Appends new questions to the bank','Blocks imports','Resets stats'],'B','New questions are appended; duplicate IDs are rejected.','',''],
['MS','Which sections appear in the feedback panel?',['Attempt feedback','Correct answer','Explanation','Tips & Traps','Leaderboard'],'A|B|C|D','There is no leaderboard; the other four sections are shown after you check an answer.','Four of five.'],
['MC','How do you move progress to another device?',['Email the browser','Save Progress, then Resume Progress on the other device','Clear All','Use Pause'],'B','Save Progress downloads a JSON file; Resume Progress restores it anywhere.','Download then upload.'],
['FB','The CSV column holding the correct answer is named ____.',[],'Answer','Required columns: ID, Type, Question, Answer.','Plain word.'],
['TF','Re-queued questions inflate the unique question count.',[],'False','Counters use unique question IDs, so retries never inflate totals.','',''],
['MC','How do you practice a hand-picked set of questions?',['Type their IDs','Tick checkboxes in the Overview table, then Practice Selected','Export CSV','Not possible'],'B','Select rows with the checkboxes and press Practice Selected.','',''],
['FB','The type code for True / False questions is ____.',[],'TF','Codes: MC, MS, TF, FB.','Two letters.'],
['MC','Which control jumps straight to the next flagged question?',['Next Marked','Skip','Redo','Prev'],'A','Next Marked cycles through questions you flagged.','',''],
['TF','Escape sequences such as \\n are ignored when comparing answers.',[],'True','Answers are normalised before comparison, so stray escape characters do not cause false mismatches.','','']
].map((d,i)=>cq({id:'SQS-'+String(i+1).padStart(2,'0'),type:d[0],q:d[1],o:d[2],a:d[3],e:d[4],h:d[5],tip:d[6]||'Read the explanation, then use Redo to try again.',topic:'Smart Quiz Studio Basics'}));
const DM={title:'Smart Quiz Studio',sub:'Learn smarter, one question at a time'};
let S={user:'',meta:{...DM},bank:DEF(),cfg:{mode:'practice',rand:true,count:20,enforce:true,replace:true,topic:''},stats:{},sess:null,sel:[],mk:[],notes:[],qc:{}},pg=0,qs='',tf='',fv='',nf='',nd='',nc='idea',qo=new Set(),P=[];
try{const r=JSON.parse(localStorage.getItem(K)||'null');if(r&&r.bank)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const B=id=>S.bank.find(q=>q.id===id),cur=()=>B(S.sess.queue[S.sess.idx]);
const VER='1.2',REL='12 Nov 2026',flagged=()=>S.bank.filter(q=>q.imp||S.mk.includes(q.id)).map(q=>q.id),topics=()=>[...new Set(S.bank.map(q=>q.topic).filter(Boolean))].sort(),pool=()=>S.bank.filter(q=>!S.cfg.topic||q.topic===S.cfg.topic);
const okQ=q=>q&&q.id&&['MC','MS','TF','FB'].includes(q.type)&&typeof q.q=='string'&&Array.isArray(q.o)&&Array.isArray(q.ai)&&Array.isArray(q.fa);
function fixState(){S.notes=(Array.isArray(S.notes)?S.notes:[]).filter(n=>n&&n.id&&typeof n.text=='string');S.qc=(S.qc&&typeof S.qc=='object'&&!Array.isArray(S.qc))?S.qc:{};S.bank=(S.bank||[]).filter(okQ);S.bank.forEach(q=>{if(q.topic==null)q.topic=/^SQS-/.test(q.id)?'Smart Quiz Studio Basics':'';q.imp=!!q.imp});const ids=new Set(S.bank.map(q=>q.id));S.mk=[...new Set((Array.isArray(S.mk)?S.mk:[]).filter(i=>ids.has(i)))];S.sel=(S.sel||[]).filter(i=>ids.has(i));Object.keys(S.qc).forEach(i=>{if(!ids.has(i)||!String(S.qc[i]||'').trim())delete S.qc[i]});S.stats=S.stats||{};S.cfg=Object.assign({mode:'practice',rand:true,count:20,enforce:true,replace:true,topic:''},S.cfg);if(S.sess&&!(Array.isArray(S.sess.queue)&&S.sess.queue.every(i=>ids.has(i))))S.sess=null}
if(S.sess&&S.sess.marked&&S.sess.marked.length&&!S.mk.length)S.mk=[...S.sess.marked];
fixState();
const stt=id=>{const s=S.stats[id];return!s||!s.a?'ns':s.s>0?'ms':'lp'},PL={ns:'Not Started',lp:'Learning in Progress',ms:'Mastered'};
const ans=q=>q.type=='FB'?q.a.split('|').join(' / '):q.type=='TF'?q.o[q.ai[0]]:q.ai.map(i=>String.fromCharCode(65+i)+'. '+q.o[i]).join('; ');
const mine=(q,s)=>q.type=='FB'?(s||'—'):(s||[]).map(i=>q.o[i]).join('; ')||'—';
const judge=(q,s)=>q.type=='FB'?q.fa.includes(norm(s||'')):[...(s||[])].sort().join()===[...q.ai].sort().join();
const all=s=>s.queue.every((_,p)=>s.ans[p]?.done);
function prog(s){const m=new Set();s.queue.forEach((id,p)=>{const a=s.ans[p];if(a?.done&&(a.ok||s.mode=='exam'||!s.enf))m.add(id)});return m.size}
function toast(m,t='info'){const d=document.createElement('div');d.className='toast '+t;d.textContent=m;$('#toasts').append(d);setTimeout(()=>d.remove(),3600)}
function dlg(h,btns,w){return new Promise(res=>{const o=document.createElement('div');o.className='ov';o.style.zIndex=70;o.innerHTML='<div class="md" style="max-width:'+(w||440)+'px">'+h+'<div class="row" style="justify-content:flex-end;margin-top:14px"></div></div>';const r=o.querySelector('.row');btns.forEach(([l,v,c])=>{const b=document.createElement('button');b.className='btn '+(c||'');b.textContent=l;b.onclick=()=>{o.remove();res(v)};r.append(b)});document.body.append(o)})}
const ask=(t,m,ok='Confirm')=>dlg('<h3 style="margin:0 0 8px">'+t+'</h3><p>'+m+'</p>',[['Cancel',false],[ok,true,'p']]);
const fail=(t,m)=>dlg('<h3 style="margin:0 0 8px;color:var(--bad)">⚠️ '+t+'</h3><p>'+m+'</p>',[['Close',1,'p']]);
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.append(a);a.click();a.remove()}
function parseCSV(t){const R=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';R.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);R.push(r)}return R.filter(x=>x.some(v=>String(v).trim()))}
const csvCell=v=>{v=String(v??'');return/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
/* ---------- auth ---------- */
function auth(){if(S.user){$('#auth').innerHTML='';home();return}$('#app').innerHTML='';$('#auth').innerHTML='<div class="ov" style="background:linear-gradient(135deg,var(--bg),var(--bg2))"><div class="md" style="text-align:center"><div style="font-size:44px">🧠</div><h1 style="font-size:26px">Smart Quiz Studio</h1><div class="sub">Version '+VER+'</div><p class="sub">Sign in to start learning (demo login: any name and password work)</p><input id="un" type="text" placeholder="Your name" style="margin:6px 0" onkeydown="if(event.key==\'Enter\')login()"><input id="pw" type="password" placeholder="Password (anything)" onkeydown="if(event.key==\'Enter\')login()"><button class="btn p" style="width:100%;margin-top:12px;padding:11px" onclick="login()">Enter Studio ⚡</button></div></div>'}
function login(){const n=$('#un').value.trim();if(!n)return toast('Please enter your name','warn');S.user=n;save();auth()}
function logout(){S.user='';save();$('#q').innerHTML='';auth()}
/* ---------- dashboard ---------- */
const cf=(k,v)=>{S.cfg[k]=v;save()};
function home(){const c0=S.cfg;if(S.cfg.topic&&!topics().includes(S.cfg.topic))S.cfg.topic='';if(tf&&!topics().includes(tf))tf='';const b=S.bank,c=S.cfg,n=b.length,pl=pool().length,k={ns:0,lp:0,ms:0};let A=0,C=0;b.forEach(q=>{k[stt(q.id)]++;const s=S.stats[q.id];if(s){A+=s.a;C+=s.c}});const ss=S.sess,live=ss&&!ss.done;const tl=live?([...new Set(ss.queue.map(id=>B(id)?.topic).filter(Boolean))].join(', ')||'General'):(c.topic||'All topics');
$('#app').innerHTML=`<div class="wrap"><div class="top"><div><div class="row" style="margin:0"><h1>⚡ ${esc(S.meta.title)}</h1><span class="vtag">v${VER}</span></div><div class="sub">${esc(S.meta.sub)}</div><div class="sub">📖 ${live?'Now practicing':'Selected topic'}: <b>${esc(tl)}</b></div></div><div class="sub">👤 ${esc(S.user)} <button class="btn" onclick="logout()">Sign out</button></div></div>
<div class="chips"><div class="chip">📚 Questions<b>${n}</b></div><div class="chip">🏆 Mastered<b>${k.ms}</b></div><div class="chip">🌱 Learning<b>${k.lp}</b></div><div class="chip">🆕 Not started<b>${k.ns}</b></div><div class="chip">🎯 Accuracy<b>${A?Math.round(C/A*100):0}%</b></div><div class="chip">⚑ Marked<b id="cm">${S.mk.length}</b></div><div class="chip">⭐ Important<b id="ci">${S.bank.filter(q=>q.imp).length}</b></div></div>
<div class="grid"><div class="side">
${acc('setup','🎛️ Quiz Setup')}
<div class="row" style="margin-top:0"><button class="btn p" onclick="start()">▶ Start Quiz</button>${live?'<button class="btn" onclick="resume()">⏯ Resume</button>':ss?'<button class="btn" onclick="results()">📊 Results</button>':''}<button class="btn" onclick="reset()">↺ Reset</button><button class="btn" onclick="flagStart()">🚩 Marked &amp; Important (<span id="cf">${flagged().length}</span>)</button></div>

const row=q=>{const s=S.stats[q.id]||{a:0,c:0,i:0,s:0},k=stt(q.id);return`<tr data-id="${esc(q.id)}"><td><input type="checkbox" class="rc" ${S.sel.includes(q.id)?'checked':''}></td><td>${esc(q.id)}<div><button class="fi ${S.mk.includes(q.id)?'on':''}" data-f="mk" title="Marked for review">⚑</button><button class="fi ${q.imp?'on':''}" data-f="imp" title="Important">⭐</button><button class="fi cb ${S.qc[q.id]?'on':''}" title="Comment on this question">💬</button></div></td><td><span class="tag">${q.type}</span></td><td class="qc">${q.topic?'<span class="tag tp">'+esc(q.topic)+'</span><br>':''}${disp(q.q)}<div class="rev"><b>Answer:</b> ${esc(ans(q))}<br><b>Explanation:</b> ${disp(q.e||'—')}</div></td><td><span class="pill ${k}">${PL[k]}</span><div class="sub">${s.a} tries · ✓${s.c} ✗${s.i} · 🔥${s.s} · ${s.a?Math.round(s.c/s.a*100):0}%</div></td></tr>${qo.has(q.id)?`<tr class="cr"><td colspan="5"><div class="row" style="margin:0 0 6px;justify-content:space-between"><b>💬 Comment on ${esc(q.id)}</b><span><button class="btn xb" data-i="${esc(q.id)}">⤢ Expand</button> <button class="btn d cx" data-i="${esc(q.id)}">Clear</button></span></div><textarea class="qa" data-i="${esc(q.id)}" placeholder="Your comment: why you missed it, a mnemonic, a correction to the question…">${esc(S.qc[q.id]||'')}</textarea></td></tr>`:''}`};
function tbl(){const f=S.bank.filter(q=>(!tf||q.topic===tf)&&(!fv||(fv=='mk'?S.mk.includes(q.id):fv=='imp'?!!q.imp:(q.imp||S.mk.includes(q.id))))&&(!qs||(q.id+' '+q.q).toLowerCase().includes(qs.toLowerCase()))),pc=Math.max(1,Math.ceil(f.length/10));pg=Math.max(0,Math.min(pg,pc-1));const p=f.slice(pg*10,pg*10+10);P=p.map(q=>q.id);const sc=$('#tw .tw')?.scrollTop||0;
$('#tw').innerHTML=`<div class="tw"><table><thead><tr><th><input type="checkbox" id="ca" ${p.length&&p.every(q=>S.sel.includes(q.id))?'checked':''}></th><th>ID</th><th>Type</th><th>Questions</th><th>Stats</th></tr></thead><tbody>${p.map(row).join('')||'<tr><td colspan="5" class="sub">No questions. Import a CSV to begin.</td></tr>'}</tbody></table></div><div class="row" style="justify-content:space-between"><span class="sub">${S.sel.length} selected · ${f.length} questions · hover or tap a question for its answer</span><span><button class="btn" onclick="pg--;tbl()" ${pg?'':'disabled'}>◀</button> <span class="sub">Page ${pg+1}/${pc}</span> <button class="btn" onclick="pg++;tbl()" ${pg<pc-1?'':'disabled'}>▶</button></span></div>`;$('#tw .tw').scrollTop=sc;updFlags();
$('#tw').oninput=e=>{const t=e.target;if(t.classList.contains('qa')){const i=t.dataset.i;t.value.trim()?S.qc[i]=t.value:delete S.qc[i];save();const b=document.querySelector('tr[data-id="'+CSS.escape(i)+'"] .cb');if(b)b.classList.toggle('on',!!S.qc[i])}};
$('#tw').onclick=e=>{const t=e.target,tr=t.closest('tr[data-id]');if(t.classList.contains('cb')){const i=tr.dataset.id;qo.has(i)?qo.delete(i):qo.add(i);tbl();return}if(t.classList.contains('xb')){const a=t.closest('tr').querySelector('.qa');a.classList.toggle('ex');t.textContent=a.classList.contains('ex')?'⤡ Collapse':'⤢ Expand';return}if(t.classList.contains('cx')){const i=t.dataset.i;delete S.qc[i];save();tbl();return}if(t.classList.contains('fi')){const i=tr.dataset.id;if(t.dataset.f=='imp')B(i).imp=!B(i).imp;else{const k=S.mk.indexOf(i);k<0?S.mk.push(i):S.mk.splice(k,1)}save();tbl();return}if(t.id=='ca'){P.forEach(i=>{const k=S.sel.indexOf(i);t.checked?k<0&&S.sel.push(i):k>=0&&S.sel.splice(k,1)});save();tbl()}else if(t.classList.contains('rc')){const i=tr.dataset.id,k=S.sel.indexOf(i);k<0?S.sel.push(i):S.sel.splice(k,1);save();tbl()}else if(tr&&t.closest('.qc'))t.closest('.qc').classList.toggle('open')}}
const acc=(k,t)=>`<details class="card acc" data-k="${k}" ${Object.assign({setup:1,bank:1},S.cfg.ac)[k]?'open':''} ontoggle="acT(this)"><summary>${t}</summary><div class="ab">`;
function acT(d){S.cfg.ac=Object.assign({setup:1,bank:1},S.cfg.ac);S.cfg.ac[d.dataset.k]=d.open?1:0;save()}
function route(files){const f=files&&files[0];if(!f)return;if(!S.user)return toast('Sign in first','warn');if($('#q').innerHTML)return toast('Close the quiz window before importing','warn');const n=f.name.toLowerCase(),h={files:[f],value:''};if(n.endsWith('.json'))ldp(h);else if(n.endsWith('.csv')||n.endsWith('.txt')||f.type=='text/csv')imp(h);else toast('Drop a .csv question bank or a .json progress file','warn')}
let dc=0;const hasF=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
addEventListener('dragenter',e=>{if(hasF(e)){e.preventDefault();dc++;document.body.classList.add('dragging')}});
addEventListener('dragover',e=>{if(hasF(e))e.preventDefault()});
addEventListener('dragleave',e=>{if(hasF(e)&&--dc<=0){dc=0;document.body.classList.remove('dragging')}});
addEventListener('drop',e=>{if(!hasF(e))return;e.preventDefault();dc=0;document.body.classList.remove('dragging');route(e.dataTransfer.files)});
const NC={progress:'📈 Progress',idea:'💡 Idea',focus:'🎯 Needs focus',feedback:'📝 Bank feedback'};
const nesc=t=>esc(t).replace(/\n/g,'<br>');
function renderNotes(){const el=$('#nl');if(!el)return;const L=S.notes.filter(n=>!nf||n.cat===nf).sort((a,b)=>b.ts-a.ts);
el.innerHTML=L.length?L.map(n=>`<div class="ni"><div class="m"><span>${NC[n.cat]||'Note'} · ${new Date(n.ts).toLocaleString()}</span><button class="btn d" style="padding:2px 8px;font-size:11px" onclick="delNote('${esc(n.id)}')">Delete</button></div>${nesc(n.text)}</div>`).join(''):'<div class="sub" style="padding:10px 0">No notes yet.</div>'}
function addNote(){const t=($('#nt').value||'').trim();if(!t)return toast('Write something first','warn');S.notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),cat:nc,text:t,ts:Date.now()});nd='';$('#nt').value='';save();renderNotes();$('#nl').scrollTop=0;toast('Note added','ok')}
async function delNote(id){if(await ask('Delete note?','This note will be removed.','Delete')){S.notes=S.notes.filter(n=>n.id!==id);save();renderNotes()}}
function toggleNotes(){S.cfg.nx=!S.cfg.nx;save();$('#nl').classList.toggle('x',!!S.cfg.nx);$('#nxb').textContent=S.cfg.nx?'⤡ Collapse':'⤢ Expand'}
function updFlags(){const m=$('#cm'),i=$('#ci'),f=$('#cf');if(m)m.textContent=S.mk.length;if(i)i.textContent=S.bank.filter(q=>q.imp).length;if(f)f.textContent=flagged().length}
function flagStart(){const f=flagged();f.length?start(f,'practice'):toast('No marked or important questions yet','warn')}
async function clrMk(){if(!S.mk.length)return toast('No marked questions','info');if(await ask('Clear all marks?','Removes the ⚑ mark from '+S.mk.length+' questions. Important tags are kept.','Clear marks')){S.mk=[];save();tbl()}}
function cmt(){const s=S.sess;s.cm=!s.cm;save();rq();if(s.cm){const t=$('#qcm');if(t){t.scrollIntoView({block:'nearest'});t.focus()}}}
function qcIn(v){const id=cur().id;v.trim()?S.qc[id]=v:delete S.qc[id];save()}
function star(){const q=cur();q.imp=!q.imp;save();rq();toast(q.imp?'Tagged as important':'Important tag removed','ok')}
/* ---------- CSV ---------- */
function imp(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=async()=>{try{
const R=parseCSV(r.result),meta={};let hi=-1;
for(let i=0;i<R.length;i++){const k=String(R[i][0]).trim().toLowerCase();if(k=='#title'||k=='#subtitle'||k=='#topic')meta[k.slice(1)]=R[i][1]||'';else if(R[i].some(x=>String(x).trim().toLowerCase()=='question')){hi=i;break}}
if(hi<0)throw'Header row not found. Required columns: ID, Type, Question, Answer.';
const H=R[hi].map(x=>String(x).trim().toLowerCase().replace(/[\s_]/g,'')),ix=n=>H.indexOf(n);
for(const n of['id','type','question','answer'])if(ix(n)<0)throw'Missing required column: '+n;
const errs=[],seen=new Set(S.cfg.replace?[]:S.bank.map(q=>q.id)),out=[];
R.slice(hi+1).forEach((x,j)=>{const g=n=>ix(n)<0?'':x[ix(n)]??'';try{const id=String(g('id')).trim();if(!id)throw'missing ID';if(seen.has(id))throw'duplicate ID "'+id+'"';const q=cq({id,type:g('type'),q:g('question'),o:'abcdef'.split('').map(l=>g('option'+l)||g(l)),a:g('answer'),e:g('explanation'),h:g('hint'),tip:g('tips')||g('tip'),topic:g('topic')||meta.topic||''});seen.add(id);out.push(q)}catch(e){errs.push(esc('Row '+(hi+j+2)+': '+(e.message||e)))}});
if(errs.length)throw{html:errs.slice(0,8).join('<br>')+(errs.length>8?'<br>…and '+(errs.length-8)+' more':'')};
if(!out.length)throw'No questions found in the file.';
if(S.cfg.replace&&S.sess&&!S.sess.done&&!await ask('Replace question bank?','This ends your current session and resets stats.','Replace'))return;
if(S.cfg.replace){S.bank=out;S.stats={};S.sess=null;S.sel=[];S.mk=[];S.qc={};S.cfg.topic='';S.meta={title:meta.title||f.name.replace(/\.csv$/i,''),sub:meta.subtitle||'Imported question bank'}}
else{S.bank=S.bank.concat(out);if(meta.title)S.meta={title:meta.title,sub:meta.subtitle||S.meta.sub}}
save();home();toast('Imported '+out.length+' questions','ok')}catch(e){fail('Import failed',e.html||esc(e.message||e))}};r.readAsText(f)}
function exp(oi){const L=oi?S.bank.filter(q=>q.imp):S.bank;if(!L.length)return toast(oi?'No important questions yet. Tag some with ☆ Important during Practice.':'Nothing to export','warn');const rows=[['#title',S.meta.title+(oi?' (Important)':'')],['#subtitle',S.meta.sub],['ID','Type','Question','OptionA','OptionB','OptionC','OptionD','OptionE','OptionF','Answer','Explanation','Hint','Tips','Topic']];
L.forEach(q=>rows.push([q.id,q.type,q.q,...[0,1,2,3,4,5].map(i=>q.type=='TF'?'':q.o[i]||''),q.type=='MC'||q.type=='MS'?q.ai.map(i=>String.fromCharCode(65+i)).join('|'):q.a,q.e,q.h,q.tip,q.topic]));
dl(oi?'important_questions.csv':'question_bank.csv',rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv');toast('Exported '+L.length+(oi?' important':'')+' questions','ok')}
async function clr(){if(await ask('Clear everything?','This deletes the question bank, all stats and the current session. It cannot be undone.','Clear All')){S.bank=[];S.stats={};S.sess=null;S.sel=[];S.mk=[];S.qc={};S.meta={...DM};save();home();toast('Question bank cleared','ok')}}
async function reset(){if(!S.sess)return toast('No active session','info');if(await ask('Reset session?','Your current session progress will be discarded. Lifetime stats are kept.','Reset')){S.sess=null;save();home()}}
function svp(){dl('quiz_progress.json',JSON.stringify({...S,ver:VER},null,1),'application/json');toast('Progress saved to a file','ok')}
function ldp(i){const f=i.files[0];i.value='';if(!f)return;const r=new FileReader();r.onload=async()=>{let d;try{d=JSON.parse(r.result);if(!d||!Array.isArray(d.bank)||!d.cfg)throw 0}catch(e){return fail('Invalid progress file','Please choose a JSON file created with Save Progress.')}
const v=await dlg('<h3 style="margin:0 0 8px">Load saved progress</h3><p>File contains <b>'+d.bank.length+'</b> questions'+(d.ver?' (saved by v'+esc(d.ver)+')':'')+'.</p><p><b>Replace</b> overwrites your bank, stats, flags, notes, comments and session with the file.<br><b>Append</b> keeps your data, adds questions with new IDs, adds attempt stats together, and merges flags, notes and question comments. Do not append the same file twice, or stats are counted twice.</p>',[['Cancel',0],['Append',2],['Replace',1,'p']],500);
if(!v)return;
if(v==1){const u=S.user;S=Object.assign({},S,d,{user:u,mk:d.mk||(d.sess&&d.sess.marked)||[]});fixState();save();home();toast('Progress replaced','ok')}
else{const have=new Set(S.bank.map(q=>q.id));let add=0;d.bank.filter(okQ).forEach(q=>{if(!have.has(q.id)){S.bank.push(q);have.add(q.id);add++}else if(q.imp)B(q.id).imp=true});
Object.entries(d.stats||{}).forEach(([id,t])=>{if(!have.has(id))return;const m=S.stats[id];if(!m)S.stats[id]={a:t.a||0,c:t.c||0,i:t.i||0,s:t.s||0};else{m.a+=t.a||0;m.c+=t.c||0;m.i+=t.i||0;m.s=Math.max(m.s,t.s||0)}});
(d.mk||(d.sess&&d.sess.marked)||[]).forEach(id=>{if(have.has(id)&&!S.mk.includes(id))S.mk.push(id)});
(Array.isArray(d.notes)?d.notes:[]).forEach(n=>{if(n&&n.id&&!S.notes.some(x=>x.id===n.id))S.notes.push(n)});Object.entries(d.qc||{}).forEach(([id,t])=>{if(!have.has(id)||!String(t).trim())return;const m=S.qc[id];if(!m)S.qc[id]=t;else if(!m.includes(t))S.qc[id]=m+'\n---\n'+t});if(!S.sess&&d.sess)S.sess=d.sess;fixState();save();home();toast('Appended '+add+' new questions; stats and flags merged','ok')}};r.readAsText(f)}
/* ---------- session ---------- */
async function start(ids,mode){if(!S.bank.length)return toast('Import a question bank first','warn');if(S.sess&&!S.sess.done&&!await ask('Start a new session?','Your unfinished session will be replaced.','Start new'))return;const c=S.cfg;
if(!ids){ids=pool().map(q=>q.id);if(c.rand)shuf(ids);ids=ids.slice(0,Math.max(1,Math.min(c.count||ids.length,ids.length)))}else if(c.rand)shuf(ids);
S.sess={queue:ids,idx:0,ans:{},rq:{},marked:[],mode:mode||c.mode,enf:c.enforce&&(mode||c.mode)=='practice',elapsed:0,paused:false,done:false,hint:false};save();rq()}
function pickStart(){S.sel.length?start([...S.sel],'practice'):toast('Tick some questions in the table first','warn')}
function resume(){S.sess.paused=false;save();rq()}
function cls(){$('#q').innerHTML='';save();home()}
function rq(){const s=S.sess,el=$('#q');if(!s||s.done){el.innerHTML='';return}
const q=cur(),a=s.ans[s.idx],ex=s.mode=='exam',pr=!ex,pos=s.idx,len=s.queue.length,u=new Set(s.queue).size,dn=prog(s),mk=S.mk.includes(q.id),last=pos==len-1;let body='';
if(s.paused)body='<div style="text-align:center;padding:50px 10px"><div style="font-size:48px">⏸</div><h3>Quiz paused</h3><p class="sub">Timer stopped and question hidden.</p><button class="btn p" onclick="pause()">▶ Resume</button></div>';
else{const fb=q.type=='FB';body=`<div style="font-size:clamp(16px,2.2vw,21px);font-weight:600">${disp(q.q)}</div>`+(q.type=='MS'?'<div class="sub">Select all that apply</div>':'')+
(fb?`<input type="text" id="fi" style="margin-top:12px" placeholder="Type your answer" value="${esc(a?a.sel:'')}" ${a?.done?'disabled':''} oninput="fbIn(this.value)" onkeydown="if(event.key=='Enter')sub()">`:q.o.map((o,i)=>{const on=a&&a.sel.includes(i),c=a?.done&&pr?(q.ai.includes(i)?'ok':on?'bad':''):on?'on':'';return`<label class="opt ${c}"><input type="${q.type=='MS'?'checkbox':'radio'}" ${on?'checked':''} ${a?.done?'disabled':''} onchange="pick(${i})"><span>${q.type=='TF'?'':'<b>'+String.fromCharCode(65+i)+'.</b> '}${disp(o)}</span></label>`}).join(''))+
(pr&&s.hint?`<div class="hint">💡 ${disp(q.h||'No hint available for this question.')}</div>`:'')+
(pr&&a?.done?`<div class="fb"><h4>Attempt feedback</h4>${a.ok?'<span style="color:var(--ok)">✅ Correct! Nice work.</span>':'<span style="color:var(--bad)">❌ Incorrect.</span> Your answer: <b>'+esc(mine(q,a.sel))+'</b>'+(s.enf&&s.queue.slice(pos+1).includes(q.id)?' · queued again at the end of this session':'')}<h4>Correct answer</h4>${esc(ans(q))}<h4>Explanation</h4>${disp(q.e||'No explanation provided.')}<h4>Tips &amp; Traps</h4>${disp(q.tip||'Re-read the explanation, then use Redo to try again.')}</div>`:ex?'<div class="sub" style="margin-top:12px">🔒 Exam mode: answers and explanations unlock in the results review.</div>':'')}
el.innerHTML=`<div class="ov"><div class="md qm"><div class="qh"><div class="row" style="margin:0;justify-content:space-between"><div class="row" style="margin:0"><span class="tag">${ex?'📝 EXAM':'🎓 PRACTICE'}</span><span class="tag">${q.type} · ${({MC:'Multiple Choice',MS:'Multiple Select',TF:'True / False',FB:'Fill in the Blank'})[q.type]}</span><span class="sub">#${esc(q.id)}</span>${q.topic?'<span class="tag tp">📖 '+esc(q.topic)+'</span>':''}${s.rq[pos]?'<span class="alert">● Needs review</span>':''}</div><div class="row" style="margin:0"><b>⏱ <span id="tm">${fmt(s.elapsed)}</span></b><button class="btn" onclick="pause()">${s.paused?'▶':'⏸'}</button><button class="btn" title="Save &amp; exit" onclick="cls()">✕</button></div></div>
<div class="row" style="margin:6px 0 0;justify-content:space-between"><b>Question ${pos+1} of ${len}</b><span class="sub">${dn}/${u} unique ${ex?'answered':'mastered'}${len>u?' · ↻ '+(len-u)+' retries':''}</span><span class="row" style="margin:0">${pr?'<button class="btn" onclick="hint()">💡 Hint</button><button class="btn" onclick="star()">'+(q.imp?'⭐ Important':'☆ Important')+'</button>':''}<button class="btn" onclick="cmt()">💬 Comment${S.qc[q.id]?' ●':''}</button><button class="btn" onclick="mark()">${mk?'⚑ Marked':'⚐ Mark'}</button></span></div><div class="bar"><i style="width:${u?dn/u*100:0}%"></i></div></div>
<div class="qb">${body}${!s.paused&&s.cm?`<div class="hint" style="background:var(--soft);color:var(--ink);border:1px solid var(--line)"><div class="row" style="margin:0 0 6px;justify-content:space-between"><b>💬 Comment on ${esc(q.id)}</b><button class="btn" onclick="cmt()">Hide</button></div><textarea class="qa" id="qcm" placeholder="Your comment: why you missed it, a mnemonic, a correction to the question…" oninput="qcIn(this.value)">${esc(S.qc[q.id]||'')}</textarea><div class="sub">Saved automatically and visible in the Question Overview table.</div></div>`:''}</div>${s.paused?'':`<div class="qf"><button class="btn" onclick="go(-1)" ${pos?'':'disabled'}>◀ Prev</button>${pr&&a?.done?'<button class="btn" onclick="redo()">↺ Redo</button>':''}<button class="btn" onclick="mark(1)">⚑ Mark &amp; Next</button><button class="btn" onclick="nm()">⏭ Next Marked (${new Set(s.queue.filter(x=>S.mk.includes(x))).size})</button>${a?.done?'':`<button class="btn p" onclick="sub()">${ex?'Submit &amp; Next':'✔ Check Answer'}</button>`}<button class="btn ${a?.done?'p':''}" onclick="next()">${a?.done?(last&&all(s)?'🏁 Finish':'Next ▶'):'Skip ▶'}</button><button class="btn d" onclick="fin()">End</button></div>`}</div></div>`;
if(!s.paused&&q.type=='FB'&&!a?.done)$('#fi')?.focus()}
function fbIn(v){const s=S.sess,a=s.ans[s.idx]||(s.ans[s.idx]={sel:'',done:false});if(!a.done){a.sel=v;save()}}
function pick(i){const s=S.sess,q=cur(),a=s.ans[s.idx]||(s.ans[s.idx]={sel:[],done:false});if(a.done)return;if(q.type=='MS'){const k=a.sel.indexOf(i);k<0?a.sel.push(i):a.sel.splice(k,1)}else a.sel=[i];save();rq()}
function sub(){const s=S.sess,q=cur(),a=s.ans[s.idx];if(a?.done)return;if(!a||(q.type=='FB'?!String(a.sel).trim():!a.sel.length))return toast('Select or type an answer first','warn');
a.done=true;a.ok=judge(q,a.sel);const st=S.stats[q.id]||(S.stats[q.id]={a:0,c:0,i:0,s:0});st.a++;if(a.ok){st.c++;st.s++}else{st.i++;st.s=0}
if(!a.ok&&s.enf&&!s.queue.some((x,p)=>p>s.idx&&x===q.id&&!s.ans[p]?.done)){s.queue.push(q.id);s.rq[s.queue.length-1]=1}
save();s.mode=='exam'?next():rq()}
function go(d){const s=S.sess;s.idx=Math.max(0,Math.min(s.queue.length-1,s.idx+d));s.hint=false;save();rq()}
function next(){const s=S.sess;if(s.idx<s.queue.length-1)go(1);else if(all(s))finish();else toast('Last question reached. Use Prev, Next Marked or End.','info')}
function mark(n){const id=cur().id,k=S.mk.indexOf(id);if(n){if(k<0)S.mk.push(id)}else k<0?S.mk.push(id):S.mk.splice(k,1);save();n?next():rq()}
function nm(){const s=S.sess,L=s.queue.length;for(let d=1;d<L;d++){const p=(s.idx+d)%L;if(S.mk.includes(s.queue[p])){s.idx=p;s.hint=false;save();return rq()}}toast('No other marked questions','info')}
function redo(){const s=S.sess;delete s.ans[s.idx];save();rq()}
function hint(){S.sess.hint=!S.sess.hint;rq()}
function pause(){const s=S.sess;if(!s.paused&&s.mode=='exam'&&new Set(s.queue).size<=30)return toast('Exam Mode allows pausing only when more than 30 questions are selected','warn');s.paused=!s.paused;save();rq()}
async function fin(){const s=S.sess;if(!all(s)&&!await ask('End session?','Unanswered questions count as incorrect. You can review everything in the results.','End & See Results'))return;finish()}
function finish(){const s=S.sess;s.done=true;s.paused=false;save();$('#q').innerHTML='';home();results()}
function results(){const s=S.sess,R=[...new Set(s.queue)].map(id=>{const q=B(id),d=s.queue.map((x,p)=>x===id?s.ans[p]:null).filter(a=>a?.done);return{q,l:d[d.length-1],ok:d.some(a=>a.ok)}}).filter(r=>r.q);
const FL=flagged(),ok=R.filter(r=>r.ok).length,wr=R.filter(r=>!r.ok).map(r=>r.q.id),pc=R.length?Math.round(ok/R.length*100):0;
dlg(`<h3 style="margin:0">📊 Results · ${s.mode=='exam'?'Exam':'Practice'}</h3><div style="font-size:34px;font-weight:800;color:${pc>=70?'var(--ok)':'var(--warn)'}">${pc}%</div><div class="sub">✓ ${ok} correct · ✗ ${R.length-ok} missed · ⏱ ${fmt(s.elapsed)}${s.queue.length>R.length?' · ↻ '+(s.queue.length-R.length)+' retries':''}</div><div style="max-height:44vh;overflow:auto;margin-top:10px">${R.map(r=>`<details style="border-top:1px solid var(--line);padding:6px 0"><summary>${r.ok?'✅':'❌'}${r.q.imp?'⭐':''}${S.mk.includes(r.q.id)?'⚑':''} <b>${esc(r.q.id)}</b> ${esc(r.q.q.slice(0,90))}</summary><div class="sub" style="margin-top:6px">Your answer: <b>${esc(r.l?mine(r.q,r.l.sel):'— skipped —')}</b><br>Correct: <b>${esc(ans(r.q))}</b><br>${disp(r.q.e||'')}<br><i>${disp(r.q.tip||'')}</i></div></details>`).join('')}</div>`,[['Close',0],...(wr.length?[['Practice missed ('+wr.length+')',1,'p']]:[]),...(FL.length?[['Marked & important ('+FL.length+')',2,'p']]:[])],620).then(v=>{if(v==1)start(wr,'practice');if(v==2)start(FL,'practice')})}
setInterval(()=>{const s=S.sess;if(!s||s.done||s.paused||!$('#q').innerHTML)return;s.elapsed++;const e=$('#tm');if(e)e.textContent=fmt(s.elapsed);if(s.elapsed%5==0)save()},1000);
auth();
</script></body></html>
